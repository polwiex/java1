<!DOCTYPE html>   
<head>    
<title> Polina Kotliarevska</title>    
<meta charset="utf-8">   
</head>  
<body> 
<div style="color:red;font-size:50px;"> 
<script language="JavaScript"> 
var x1_kot=prompt("x1=",""); 
var x2_kot=prompt("x2=",""); 
var a=parseFloat(x1_kot); 
var b=parseFloat(x2_kot); 
var y1_kot = 3*Math.pow(x1_kot,6/8);
var x1_kot_rad = (x1_kot*Math.PI)/180;
var y2_kot = 2*Math.cos(x1_kot_rad) + 3*Math.cos(x1_kot_rad);
var y3_kot = Math.pow(Math.pow(x1_kot,4)+2*Math.pow(x2_kot,6),1/3)*Math.abs(x1_kot - x2_kot);
document.write("x1="+x1_kot+"&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;x2="+x2_kot+"<br>");
document.write("x1_rad="+x1_kot_rad.toFixed(2)+"<br>");
document.write("y1="+y1_kot.toFixed(2)+"<br>");
document.write("y2="+y2_kot.toFixed(2)+"<br>");
document.write("y3="+y3_kot.toFixed(2)+"<br>");
</script> 
</div> 
</body> 
</html>
