<!DOCTYPE html>
<html lang="pl-PL"> 
     <head> 
      <meta charset="UTF-8">
            <title>zadanie 8</title>  
            <script type="text/javascript"> 
                  function show_confirm()
 {
 var r=confirm("Naciśnij klawisz");
 if (r==true)
 { document.write("Nacisnąłeś OK!"); }
 else
 { document.write("Nacisnąłeś Cancel!"); }
 }

            </script>
      </head> 
<body>
<script type="text/javascript">
document.write("<b>Zastosowanie:</b><br>Jest używany, jeśli chcemy zapytać użytkownika o weryfikacje, lub akceptację jakichś danych.<br>Użytkownik musi nacisnąć „OK” w celu akceptacji bądź „Cancel” w celu odrzucenia. <br>Jeżeli zostanie wybrane „OK” metoda zwraca true w przeciwnym wypadku false.<br>");

</script>
<form>
<input type="button" onclick="show_confirm()" value="Pokaż confirm box"><br><br>
<input type="button" value="zamknij okno" onclick="window.close()"></form>
</body> 
</html>
