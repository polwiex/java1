<!DOCTYPE html>   
<head>    
<title> Użycie fukcji </title>    
<meta charset="utf-8">   
</head>  
<body> 
<div style="color:navy;font-size:50px;"> 
<script language="JavaScript"> 
var a=parseFloat(prompt("a=","")); 
var b=parseFloat(prompt("b=","")); 
function suma_kot(a, b) { 
return a + b; 
} 
document.write("suma="+suma_kot(a,b)+"<br>"); 
function odejmowanie_kot(a, b) { 
return a - b; 
} 
document.write("odejmowanie="+odejmowanie_kot(a,b)+"<br>");
function mnożenie_kot(a, b) { 
return a * b; 
} 
document.write("mnożenie="+mnożenie_kot(a,b)+"<br>");
function od_kwadratu_kot(a, b) { 
return a ^2 ; 
} 
document.write("od_kwadratu="+od_kwadratu_kot(a,b)+"<br>");
</script> 
</div> 
</body> 
</html>
