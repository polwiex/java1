
<!DOCTYPE html>   
<head>    
<title>Polinka Malinka</title>    
<meta charset="utf-8">   
</head>  
<body> 
<div style="color:navy;font-size:50px;"> 
<script language="JavaScript"> 
var a=parseFloat(prompt("a=","")); 
var b=parseFloat(prompt("b=","")); 
function suma_kot(a, b) { 
return a + b; 
}
function odejmowanie_kot(a, b) { 
return a - b; 
} 
function mnozenie_kot(a, b) { 
return a * b; 
}
function kwadrat_kot1(a, b) { 
return a * a;
}
function kwadrat_kot2(a, b) { 
return b * b;
}
function reszta_kot(a, b) { 
return a % b;
}
document.write("suma_kot("+a+","+b+")="+suma_kot(a,b)+"<br>");
document.write("odejmowanie_kot("+a+","+b+")="+odejmowanie_kot(a,b)+"<br>");
document.write("mnożenie_kot("+a+","+b+")="+mnozenie_kot(a,b)+"<br>");
document.write("od_kwadratu_kot"+a+","+b+")<br>"+a+"^2 = "+kwadrat_kot1(a,b)+"<br>"+b+"^2 = "+kwadrat_kot2(a,b)+"<br>");
document.write("reszta_z_dzielenia_a_przez_b_kot("+a+","+b+")="+reszta_kot(a,b)+"<br>");
</script> 
</div> 
</body> 
</html>
