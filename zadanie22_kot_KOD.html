<!DOCTYPE>
<html>
<head>
<meta charset="UTF-8">
<title>Polina Kotliarevska</title>
</head>
<body>
<script language="JavaScript">
function Pole_kotliarevska(a_kot,b_kot)
{
var wynik_kot = a_kot*b_kot;
document.getElementById("wyprowadz_pole_kot").value = wynik_kot.toFixed(2)+" cm^2";
}
function obwod_kotliarevska(a_kot,b_kot)
{
var wynik_kot = 2*a_kot+2*b_kot;
document.getElementById("wyprowadz_obwod_kot").value = wynik_kot.toFixed(2)+" cm";
}
</script>

<h1>Obliczanie pola i obwodu prostokąta</h1>
Podaj długość boku a:
<input type="text" id="a_dana_kot"> cm<br><br>
Podaj długość boku b:
<input type="text" id="b_dana_kot"> cm<br>
<input type="button" name="pole" value="Oblicz pole"  onclick="Pole_kotliarevska(parseFloat(document.getElementById('a_dana_kot').value),parseFloat(document.getElementById('b_dana_kot').value))"><br><br>
<input type="button" name="obw" value="Oblicz obwód" onclick="obwod_kotliarevska(parseFloat(document.getElementById('a_dana_kot').value),parseFloat(document.getElementById('b_dana_kot').value))"><br><br>
Pole
<input type="text" name="pole" id="wyprowadz_pole_kot">
Obwód
<input type="text" name="obw" id="wyprowadz_obwod_kot">
</body>
</html>
