<!DOCTYPE html>
<html lang="pl-PL"> 
     <head> 
      <meta charset="UTF-8">
            <title>zadanie 9</title>  
            <script type="text/javascript">
 function show_prompt()
 {
 var name=prompt("Napisz imię","Imię Nazwisko");
 if (name!=null && name!="")
 {
 document.write("Witaj " + name + "! jak się masz?");
 }
 }
 </script> 
      </head> 
<body>
<script type="text/javascript">
document.write("<b>Zastosowanie:</b><br>Jest używany kiedy użytkownik ma wpisać coś np. zanim wejdzie w dany moduł strony. Np. hasło.<br>Użytkownik po wpisaniu wartości może nacisnąć „OK.” albo „Cancel” Jeżeli użytkownik kliknie „OK.” <br>metoda zwraca wpisaną wartość, a w przeciwnym wypadku zwraca null.<br>");
</script>
<form>
<input type="button" onclick="show_prompt()" value="Pokaż prompt box"><br><br>
<input type="button" value="zamknij okno" onclick="window.close()"></form>
</body> 
</html>
